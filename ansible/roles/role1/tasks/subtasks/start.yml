---
- name: Сборка образов и запуск микросервисов через docker-compose.yml
  community.docker.docker_compose_v2:
    project_src: "{{ compose_project_dir }}"
    files:
      - docker-compose.yml
    build: always
    state: present

- name: Ожидание ответа frontend (страница доступна)
  ansible.builtin.uri:
    url: http://localhost/
    status_code: 200
  register: frontend_check
  retries: 12
  delay: 5
  until: frontend_check.status == 200

- name: Проверка связи frontend -> backend (запрос /read через nginx)
  ansible.builtin.uri:
    url: http://localhost/read
    status_code: 200
  register: backend_check
  retries: 12
  delay: 5
  until: backend_check.status == 200

- name: Список запущенных контейнеров
  ansible.builtin.command: docker compose ps
  args:
    chdir: "{{ compose_project_dir }}"
  register: compose_ps
  changed_when: false

- name: Вывод состояния контейнеров
  ansible.builtin.debug:
    var: compose_ps.stdout_lines
