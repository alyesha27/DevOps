---
- name: Установка базовых пакетов (curl, git, gnupg)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Создание каталога для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Добавление GPG-ключа Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Добавление репозитория Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Установка Docker Engine и Docker Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Включение автозапуска и запуск службы Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Добавление пользователя в группу docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Проверка версии Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Проверка версии Docker Compose
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Вывод установленных версий
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ compose_version.stdout }}"
