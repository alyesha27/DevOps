---
# Значения по умолчанию для роли role1

# Пакеты, необходимые для добавления репозитория Docker и клонирования проектов
base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git

# Docker Engine и плагин Docker Compose
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Архитектура для apt-репозитория Docker
docker_apt_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

# Каталог с docker-compose.yml на удалённой ноде
compose_project_dir: "{{ deploy_root }}/DevOps"
